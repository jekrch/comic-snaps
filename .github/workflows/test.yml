name: Tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker/src/**"
      - "worker/package.json"
      - "worker/bun.lock"
      - "scripts/**"
      - "package.json"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - ".github/workflows/test.yml"
  pull_request:
  workflow_dispatch:

jobs:
  js:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # @jekrch/dimensional-docs is a private repo, installed over SSH with a
      # read-only deploy key.
      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.DIMENSIONAL_DOCS_DEPLOY_KEY }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The worker's tests import its modules, and those import the worker's
      # own dependencies (the Gemini SDK), which the root install doesn't cover.
      - name: Install worker dependencies
        working-directory: worker
        run: bun install --frozen-lockfile

      # The app build and the test suite are typechecked as separate projects
      # so a type error in a test never blocks a deploy.
      - name: Typecheck app
        run: bunx tsc -b

      - name: Typecheck tests
        run: bun run test:types

      - name: Unit tests
        run: bun run test:coverage

  python:
    name: Metadata pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-dev.txt

      - name: Unit tests
        run: pytest scripts/tests -q
