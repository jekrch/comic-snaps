name: Compute Image Metadata

on:
  push:
    branches: [main]
    paths:
      - "public/data/gallery.json"
  workflow_dispatch:

# One run at a time. Overlapping runs each computed the same new panels and
# then hit rebase conflicts on embeddings*.json when committing. Runs queue
# instead, and a burst of pushes collapses to the running job plus one
# pending job (a newer pending run replaces an older one).
concurrency:
  group: compute-image-metadata
  cancel-in-progress: false

jobs:
  compute-metadata:
    runs-on: ubuntu-latest
    # Skip runs triggered by the bot's own commits
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      # Check out the branch head, not the triggering commit: a run that
      # waited in the concurrency queue must start from the previous run's
      # bot commit, or it would redo that work and conflict with it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache installed packages
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ${{ env.pythonLocation }}
          key: pip-installed-${{ runner.os }}-py3.12-${{ hashFiles('scripts/requirements.txt') }}

      - name: Install dependencies
        if: steps.pip-cache.outputs.cache-hit != 'true'
        run: pip install -r scripts/requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-siglip-base-patch16-224-dinov2-small

      - name: Cache torchvision models
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: torchvision-vgg16

      # Raw (pre-PCA) Gram features keyed by image hash, so the gram model
      # only runs VGG on new images instead of the whole gallery. The exact
      # key never matches; restore-keys picks the newest saved cache.
      - name: Restore Gram feature cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/comic-snaps
          key: gram-features-v1-${{ github.sha }}
          restore-keys: gram-features-v1-

      - name: Hash Gram feature cache (before)
        id: gram-before
        run: |
          f=~/.cache/comic-snaps/gram-features.npz
          if [ -f "$f" ]; then h=$(sha256sum "$f" | cut -c1-16); else h=none; fi
          echo "hash=$h" >> "$GITHUB_OUTPUT"

      # The metadata script waits on API rate limits and the embeddings
      # script is CPU-bound, so they run side by side. Embeddings read only
      # panel ids and image paths, which the metadata script never changes;
      # they read a snapshot of gallery.json because the metadata script
      # rewrites the file when it finishes. The two write disjoint files.
      - name: Compute metadata and embeddings
        env:
          PYTHONUNBUFFERED: "1"
          COMIC_VINE_API_KEY: ${{ secrets.COMIC_VINE_API_KEY }}
          METRON_USERNAME: ${{ secrets.METRON_USERNAME }}
          METRON_PASSWORD: ${{ secrets.METRON_PASSWORD }}
        run: |
          cp public/data/gallery.json "$RUNNER_TEMP/gallery-snapshot.json"
          EMBED_GALLERY_PATH="$RUNNER_TEMP/gallery-snapshot.json" \
            python scripts/compute-embeddings.py > "$RUNNER_TEMP/embeddings.log" 2>&1 &
          embed_pid=$!

          meta_status=0
          python scripts/compute-image-metadata.py --skip-gcd || meta_status=$?

          embed_status=0
          wait "$embed_pid" || embed_status=$?
          echo
          echo "=============== compute-embeddings.py ==============="
          cat "$RUNNER_TEMP/embeddings.log"

          echo "metadata exit: $meta_status, embeddings exit: $embed_status"
          [ "$meta_status" -eq 0 ] && [ "$embed_status" -eq 0 ]

      - name: Hash Gram feature cache (after)
        id: gram-after
        if: ${{ !cancelled() }}
        run: |
          f=~/.cache/comic-snaps/gram-features.npz
          if [ -f "$f" ]; then h=$(sha256sum "$f" | cut -c1-16); else h=none; fi
          echo "hash=$h" >> "$GITHUB_OUTPUT"

      # Saved only when this run changed it; the cache file is written
      # atomically, so it's valid even if a later step failed.
      - name: Save Gram feature cache
        if: ${{ !cancelled() && steps.gram-after.outputs.hash != 'none' && steps.gram-after.outputs.hash != steps.gram-before.outputs.hash }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/comic-snaps
          key: gram-features-v1-${{ steps.gram-after.outputs.hash }}

      # - name: Compute text embeddings
      #   run: python scripts/compute-text-embeddings.py

      - name: Commit updated data
        run: |
          git add public/data/gallery.json public/data/embeddings.json public/data/embeddings-dino.json public/data/embeddings-gram.json public/data/artists.json public/data/series.json
          [ -f public/data/issues.json ] && git add public/data/issues.json
          [ -f public/data/publishers.json ] && git add public/data/publishers.json
          [ -f public/data/disambiguation.json ] && git add public/data/disambiguation.json
          [ -d public/data/covers ] && git add public/data/covers
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update image metadata and embeddings"
          git pull --rebase
          git push
          # Deploy is triggered automatically by deploy.yml's workflow_run on this job's completion.