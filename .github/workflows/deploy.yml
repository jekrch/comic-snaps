name: Deploy Gallery

on:
  push:
    branches: [main]
    # Everything the Compute Image Metadata job writes is ignored here: that
    # job's completion is what triggers the deploy (workflow_run, below), so
    # building on its commits too would just double up. This list mirrors that
    # job's `git add`. public/data/ratings.json is deliberately NOT ignored —
    # the bot commits it directly and nothing else would rebuild for it.
    paths-ignore:
      - 'public/images/**'
      - 'public/data/gallery.json'
      - 'public/data/artists.json'
      - 'public/data/series.json'
      - 'public/data/issues.json'
      - 'public/data/disambiguation.json'
      - 'public/data/embeddings.json'
      - 'public/data/embeddings-dino.json'
      - 'public/data/embeddings-gram.json'
      - 'public/data/covers/**'
  workflow_dispatch:
  workflow_run:
    workflows: ["Compute Image Metadata"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # For workflow_run triggers, only deploy if the upstream workflow succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # - name: Wait for additional commits
      #   run: sleep 10

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      # @jekrch/dimensional-docs is a private repo, installed over SSH with a
      # read-only deploy key.
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DIMENSIONAL_DOCS_DEPLOY_KEY }}

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Deploy runs as its own job. In the same job, deploy-pages asks the artifact
  # service for "github-pages" a fraction of a second after the upload
  # finalizes and can get an empty list back ("Found 0 artifact(s)"). The job
  # boundary gives the artifact time to become listable, and re-running a
  # failed deploy reuses the build's artifact instead of uploading a second one
  # ("Multiple artifacts named github-pages").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5