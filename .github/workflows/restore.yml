name: Restore Panel

# Started by the Telegram bot's /restore and /redo (worker/src/restore.ts), or by
# hand from the Actions tab. scripts/restore_judge.py runs the restore skills'
# scripts and asks Gemini only to judge each result: install it, retry with
# other flags, or skip. Everything else (finding the panel, choosing the skill,
# checking what changed, committing, replying in the chat) is
# scripts/restore_ci.py and shell, so none of it depends on the model.
#
# The model never runs anything. It answers in JSON, and the judge checks every
# flag against a fixed list with ranges before using it. That's also what keeps
# the cost down: one API call per round and at most four rounds, against the
# 30 to 50 turns, each resending the whole session, that an agent took.
#
# Separate jobs, because the model reads text anyone in the chat can write (the
# panel's title and notes, the photo itself). The restore job holds nothing
# worth taking beyond the Gemini key it needs: a read-only token, no git
# credentials on disk, no Telegram token. All it hands on is the restored image
# and the summary. The publish job starts from a clean checkout, installs that
# image with the repo's own install command, checks the result, and only then
# commits and replies.
#
# The result lands on its own branch, restore/{seq}, and never on main. /approve
# in the chat applies it to main through the worker (which also makes that push
# start the metadata job, as a push from this workflow's token couldn't).
#
# Secrets: GEMINI_API_KEY (its own copy; the Worker's lives in Cloudflare) and
# TELEGRAM_BOT_TOKEN for the reply. Variable RESTORE_MODEL overrides the model,
# and the model input overrides it for one run started by hand.

on:
  workflow_dispatch:
    inputs:
      seq:
        description: Panel id (the number the bot shows)
        required: true
      notes:
        description: Directions for the restorer (optional)
        required: false
        default: ""
      redo:
        description: Show the restorer the attempt already on restore/{seq}
        type: boolean
        default: false
      chat_id:
        description: Telegram chat to reply in (set by the bot)
        required: false
        default: ""
      reply_to:
        description: Telegram message to reply to (set by the bot)
        required: false
        default: ""
      model:
        description: Gemini model for this run only (blank uses RESTORE_MODEL or the default)
        required: false
        default: ""

# A /redo while a run is going replaces it.
concurrency:
  group: restore-${{ inputs.seq }}
  cancel-in-progress: true

permissions: {}

env:
  SEQ: ${{ inputs.seq }}
  BRANCH: restore/${{ inputs.seq }}

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check input
        run: |
          [[ "$SEQ" =~ ^[0-9]+$ ]] || { echo "seq must be a number, got '$SEQ'"; exit 1; }
          echo "WORK=$RUNNER_TEMP/restore" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/restore/out"

      # Full history, because a panel restored before is restored again from the
      # photo as first posted, which `panel.py original` recovers from git.
      # Blobs are fetched on demand, so the image history isn't downloaded. The
      # repo is public, so that needs no credentials, and none are left on disk.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/skills/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/skills/requirements.txt

      - name: Find the panel
        id: panel
        run: python scripts/restore_ci.py lookup "$SEQ" | tee -a "$GITHUB_OUTPUT"

      # restore-panel's original and routing steps: the photo as first posted,
      # and the color check that picks the skill.
      - name: Prepare the photo
        id: prepare
        run: python scripts/restore_ci.py prepare "$SEQ" "$WORK" | tee -a "$GITHUB_OUTPUT"

      - name: Read the previous attempt
        id: previous
        if: inputs.redo == true || inputs.redo == 'true'
        run: |
          if git fetch --quiet origin "$BRANCH" 2>/dev/null; then
            {
              echo "context<<RESTORE_EOF_$GITHUB_RUN_ID"
              echo "This is a redo. The notes say what to change from the previous attempt, whose summary was:"
              git log -1 --format=%b FETCH_HEAD | grep -v "^RESTORE_EOF_"
              echo "RESTORE_EOF_$GITHUB_RUN_ID"
            } >> "$GITHUB_OUTPUT"
          fi

      # Writes $WORK/out/restored.jpg if the model chose to install a result,
      # and $WORK/out/summary.txt either way. Its log shows each round and the
      # tokens it used.
      - name: Restore
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model || vars.RESTORE_MODEL || 'gemini-4-argon' }}
          SOURCE: ${{ steps.prepare.outputs.source }}
          VERDICT: ${{ steps.prepare.outputs.verdict }}
          LABEL: ${{ steps.panel.outputs.label }}
          NOTES: ${{ inputs.notes }}
          PREVIOUS: ${{ steps.previous.outputs.context }}
        run: python scripts/restore_judge.py --source "$SOURCE" --verdict "$VERDICT" --label "$LABEL" --work "$WORK"

      - uses: actions/upload-artifact@v4
        with:
          name: restore
          path: ${{ runner.temp }}/restore/out
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CHAT_ID: ${{ inputs.chat_id }}
      REPLY_TO: ${{ inputs.reply_to }}
    steps:
      - name: Check input
        run: |
          [[ "$SEQ" =~ ^[0-9]+$ ]] || { echo "seq must be a number, got '$SEQ'"; exit 1; }
          echo "WORK=$RUNNER_TEMP/restore" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/restore"

      # The same commit the restore job checked out.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/skills/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/skills/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: restore
          path: ${{ runner.temp }}/restore/out

      - name: Install, check and commit
        id: result
        run: |
          panel=$(python scripts/restore_ci.py lookup "$SEQ")
          id=$(sed -n 's/^id=//p' <<< "$panel")
          image=$(sed -n 's/^image=//p' <<< "$panel")
          label=$(sed -n 's/^label=//p' <<< "$panel")
          echo "label=$label" >> "$GITHUB_OUTPUT"
          cp "public/$image" "$WORK/before.jpg"

          # Installed again here, by this checkout's own install command, rather
          # than taking the restore job's gallery.json and embeddings as given.
          if [ -f "$WORK/out/restored.jpg" ]; then
            python scripts/skills/restore-bw-panel/restore.py install "$id" "$WORK/out/restored.jpg"
          fi
          git status --short
          out=$(python scripts/restore_ci.py verify "$SEQ" "$image")
          echo "$out" | tee -a "$GITHUB_OUTPUT"
          [ "$(sed -n 's/^installed=//p' <<< "$out")" = true ] || exit 0

          new_image=$(sed -n 's/^new_image=//p' <<< "$out")
          paths=$(sed -n 's/^paths=//p' <<< "$out")
          python scripts/restore_ci.py compare "$WORK/before.jpg" "public/$new_image" "$WORK/compare.jpg"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # shellcheck disable=SC2086
          git add -A -- $paths
          {
            echo "Restore #$SEQ: $label"
            echo
            cat "$WORK/out/summary.txt"
          } > "$WORK/message.txt"
          git commit -F "$WORK/message.txt"
          git push --force origin "$BRANCH"

      - name: Reply in Telegram
        if: inputs.chat_id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          INSTALLED: ${{ steps.result.outputs.installed }}
          LABEL: ${{ steps.result.outputs.label }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || { echo "No TELEGRAM_BOT_TOKEN secret; not replying."; exit 0; }
          summary=$(cat "$WORK/out/summary.txt")
          # A run started by hand has no message to reply to.
          reply=$(jq -nc --arg id "$REPLY_TO" 'if $id == "" then {} else {reply_parameters: {message_id: ($id | tonumber), allow_sending_without_reply: true}} end')
          api="https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN"

          if [ "$INSTALLED" = true ]; then
            # Captions stop at 1024 characters.
            caption=$(printf 'Restored #%s · %s\nBefore | after\n\n%s\n\n/approve %s puts it on the site\n/redo %s {what to change}\n/reject %s drops it' \
              "$SEQ" "$LABEL" "${summary:0:760}" "$SEQ" "$SEQ" "$SEQ")
            reply_field=()
            [ -z "$REPLY_TO" ] || reply_field=(--form-string "reply_parameters=$(jq -c '.reply_parameters' <<< "$reply")")
            curl -sS --fail-with-body "$api/sendPhoto" \
              --form-string "chat_id=$CHAT_ID" \
              --form-string "caption=$caption" \
              "${reply_field[@]}" \
              -F "photo=@$WORK/compare.jpg" > /dev/null
          else
            text=$(printf 'Left #%s · %s as it is.\n\n%s\n\n/restore %s {directions} tries again.' \
              "$SEQ" "$LABEL" "${summary:0:3500}" "$SEQ")
            jq -nc --arg chat "$CHAT_ID" --arg text "$text" --argjson reply "$reply" \
              '{chat_id: $chat, text: $text} + $reply' |
              curl -sS --fail-with-body "$api/sendMessage" -H 'Content-Type: application/json' -d @- > /dev/null
          fi

  report:
    needs: [restore, publish]
    if: failure() && inputs.chat_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHAT_ID: ${{ inputs.chat_id }}
      REPLY_TO: ${{ inputs.reply_to }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report the failure
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || exit 0
          # A run started by hand has no message to reply to.
          reply=$(jq -nc --arg id "$REPLY_TO" 'if $id == "" then {} else {reply_parameters: {message_id: ($id | tonumber), allow_sending_without_reply: true}} end')
          jq -nc --arg chat "$CHAT_ID" --arg text "Restore #$SEQ failed. Log: $RUN_URL" --argjson reply "$reply" \
            '{chat_id: $chat, text: $text} + $reply' |
            curl -sS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -H 'Content-Type: application/json' -d @- > /dev/null
